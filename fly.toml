# fly.toml app configuration file generated for hookfish-agent-prod on 2026-04-30T20:27:42+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hookfish-agent-prod'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile.agent'

[env]
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
